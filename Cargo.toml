[package]
name = "cli-kit"
version = "0.5.0"
description = "Reusable CLI helpers: structured output, interactive prompts, and logging bootstrap"
edition = "2024"
license = "MIT"

[dependencies]
anyhow             = { version = "1" }
clap               = { version = "4", features = ["derive", "env"] }
clap_complete      = { version = "4" }
cliclack           = "0.3"
comfy-table        = { version = "7", features = ["custom_styling"] }
console            = "0.15"
crossterm          = { version = "0.28", optional = true }
dirs               = { version = "6" }
nucleo-matcher     = "0.3"
ratatui            = { version = "0.29", optional = true }
serde              = { version = "1", features = ["derive"] }
serde_json         = { version = "1" }
toml               = { version = "0.8" }
thiserror          = { version = "2" }
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width      = { version = "0.2", optional = true }
zeroize            = { version = "1.7", features = ["derive", "serde"], optional = true }

[dev-dependencies]
tempfile = { version = "3" }

[features]
default = []
tui = ["ratatui", "crossterm", "unicode-width", "zeroize"]

[[example]]
name = "tui"
required-features = ["tui"]

[[example]]
name = "chord"
required-features = ["tui"]

[[example]]
name = "screen_canary"
required-features = ["tui"]

[[example]]
name = "outline"
required-features = ["tui"]

[[example]]
name = "text_area"
required-features = ["tui"]

[[example]]
name = "wait"
required-features = ["tui"]
