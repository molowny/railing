
[package]
name = "cli-kit"
version = "0.1.0"
edition = "2021"
description = "Reusable CLI helpers: structured output, interactive prompts, and logging bootstrap"
license = "MIT"

  [package.metadata.release]
  tag-name = "{{version}}"

[dependencies]
# Error handling
anyhow = "1"
# Needed by clap ValueEnum for OutputFormat
clap = { version = "4", features = ["derive"] }
# Interactive prompts & UI
cliclack = "0.3"
# Output tables
comfy-table = "7"
console = "0.15"
crossterm = { version = "0.28", optional = true }
# Interactive picker (optional, behind "picker" feature)
nucleo-matcher = { version = "0.3", optional = true }
# TUI rendering (optional, behind "tui" feature)
ratatui = { version = "0.29", optional = true }
# Serialization (JSON output)
serde_json = "1"
thiserror = "2"
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = { version = "0.2", optional = true }

[features]
default = []
picker = ["crossterm", "nucleo-matcher", "tui"]
tui = ["ratatui", "unicode-width"]

[[example]]
name = "picker"
required-features = ["picker"]

[[example]]
name = "tui"
required-features = ["tui"]
