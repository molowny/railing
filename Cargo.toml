
[package]
name = "cli-kit"
version = "0.6.0"
description = "Reusable CLI helpers: structured output, interactive prompts, and logging bootstrap"
edition = "2024"
license = "MIT"

[dependencies]
clap               = { version = "4", features = ["derive", "env"], optional = true }
clap_complete      = { version = "4", optional = true }
comfy-table        = { version = "7", features = ["custom_styling"], optional = true }
crossterm          = { version = "0.28", optional = true }
dirs               = { version = "6", optional = true }
nucleo-matcher     = { version = "0.3", optional = true }
ratatui            = { version = "0.29", optional = true }
serde              = { version = "1", features = ["derive"], optional = true }
serde_json         = { version = "1", optional = true }
toml               = { version = "0.8", optional = true }
tracing            = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
unicode-width      = "0.2"
zeroize            = { version = "1.7", features = ["derive", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { version = "3" }
# Apps pass anyhow errors to `CliError::internal`; the tests hold the chain
# that comes through to what it always said. cli-kit itself has no anyhow.
anyhow   = { version = "1" }
# The golden capture (tests/golden): a terminal emulator to read the pty
# back as a screen, and openpty. avt, not vt100: vt100 0.15 drops SGR 2
# (dim), and 0.16+ needs a unicode-width that ratatui's `=0.2.0` pin rules out.
avt      = "0.19"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

# What cli-kit draws today, as the refactor's target (docs/core-refactor.md
# § M0). Its own main: scenes re-run this binary on a pty.
[[test]]
name = "golden"
path = "tests/golden/main.rs"
harness = false
required-features = ["full"]

[features]
default = ["full"]
# Everything but the core (`style`, `term`, `glyph`, `spin`): flows,
# prompts, output, errors, logging. Off, cli-kit is the core alone, over
# libc, unicode-width and zeroize — for a process that draws on a terminal
# it does not own and must keep its dependency tree small (sealward-askpass).
full = [
  "dep:clap", "dep:clap_complete", "dep:comfy-table",
  "dep:dirs", "dep:nucleo-matcher", "dep:serde", "dep:serde_json",
  "dep:toml", "dep:tracing", "dep:tracing-subscriber",
]
tui = ["full", "ratatui", "crossterm"]

