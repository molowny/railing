[package]
name = "cli-kit"
version = "0.1.0"
description = "Reusable CLI helpers: structured output, interactive prompts, and logging bootstrap"
edition = "2024"
license = "MIT"

[dependencies]
anyhow             = { version = "1" }
clap               = { version = "4", features = ["derive"] }
cliclack           = "0.3"
comfy-table        = "7"
console            = "0.15"
crossterm          = { version = "0.28", optional = true }
dirs               = { version = "6" }
nucleo-matcher     = { version = "0.3", optional = true }
ratatui            = { version = "0.29", optional = true }
serde              = { version = "1", features = ["derive"] }
serde_json         = { version = "1" }
toml               = { version = "0.8" }
thiserror          = { version = "2" }
tracing            = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width      = { version = "0.2", optional = true }

[dev-dependencies]
tempfile = { version = "3" }

[features]
default = []
tui = ["ratatui", "crossterm", "nucleo-matcher", "unicode-width"]

[[example]]
name = "tui"
required-features = ["tui"]
