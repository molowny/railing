[workspace]
# Breaking changes (`feat!`, or an API break cargo-semver-checks finds) bump
# 0.x to 0.(x+1); `feat` and `fix` bump the patch.
semver_check = true
features_always_increment_minor = false
changelog_update = true
git_release_enable = true
# Plain versions everywhere: tag `0.9.1`, release `0.9.1`, no `v`.
git_tag_name = "{{ version }}"
git_release_name = "{{ version }}"
pr_name = "chore: release {{ version }}"
